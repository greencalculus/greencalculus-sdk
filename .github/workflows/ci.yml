name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline)
        working-directory: python
        run: python -m unittest discover -s tests -v
      - name: Build the distribution
        working-directory: python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

  js:
    name: JS / TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: js
        run: npm ci || npm install
      - name: Typecheck
        working-directory: js
        run: npx tsc --noEmit
      - name: Build
        working-directory: js
        run: npm run build

  sheets:
    name: Sheets add-in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests
        working-directory: sheets
        run: node --test test/core.test.mjs

  postman:
    name: Postman collection (live, keyless)
    runs-on: ubuntu-latest
    # The collection is published to strangers who press Send before they read
    # anything. Its ten keyless requests are checked on every push; the keyed
    # ones need a secret and are checked by hand before a publish.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Every keyless request in the collection answers
        working-directory: postman
        run: node check-collection.mjs

      # Answering is not the same as being the request the spec asks for. A
      # stale version pin passes the check above and fails this one.
      - name: The collection still matches the spec it was generated from
        working-directory: postman
        run: node check-collection-parity.mjs

  keyless-contract:
    name: Keyless contract (live)
    runs-on: ubuntu-latest
    # The corpus is open to read. If this breaks, every "no key needed"
    # promise in the READMEs is false — so it is a build failure, not a note.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: A factor resolves with no API key
        working-directory: python
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from greencalculus import GreenCalculus, GreenCalculusError
          gc = GreenCalculus()
          f = gc.factor("grid.gbr.electricity.location_based")
          # The keyless envelope must mirror the keyed one, or the documented
          # accessors break for one half of our users.
          assert isinstance(f["value"], (int, float)), f
          assert f["unit"], f
          assert f["factor"]["source"]["cell_ref"], f
          assert f["factor"]["citation"]["proof_url"].startswith("https://verify.greencalculus.com/"), f
          assert "source" not in f and "citation" not in f, "row leaked to the top level"
          assert gc.search("diesel", limit=1)["factors"], "keyless search returned nothing"
          for label, call in (
              ("as_of", lambda: gc.factor("grid.gbr.electricity.location_based", as_of="2026.150")),
              ("calc",  lambda: gc.ghg_activity(activity={"value": 1, "unit": "kWh"})),
          ):
              try:
                  call(); raise SystemExit(f"{label} should need a key but did not")
              except GreenCalculusError as e:
                  assert e.status == 401, (label, e.status)
          print("keyless contract holds:", f["value"], f["unit"])
          PY
